name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy n
        working-directory: /home/gkucmierz/docker/nonograms-app
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build