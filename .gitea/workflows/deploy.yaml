name: Deploy to Production
run-name: Deploy to Production by @${{ github.actor }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and deploy with Docker Compose
        run: |
          docker compose up -d --build
