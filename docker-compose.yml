name: nonograms-app

services:
  nonograms-app:
    container_name: nonograms-app
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "8083:80"
    expose:
      - "80"
    restart: unless-stopped
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      npm_public:
        aliases:
          - nonograms-app

networks:
  npm_public:
    external: true
